services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_dev}
    # localhost-only by default so a public VM does not expose the database.
    # The load rig's data box sets PG_BIND=0.0.0.0 and filters in the firewall.
    ports:
      - ${PG_BIND:-127.0.0.1}:5432:5432
    volumes:
      # pg18 stores data in a version subdir, so mount the parent
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - ${REDIS_BIND:-127.0.0.1}:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
