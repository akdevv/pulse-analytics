<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sites — Pulse</title>
    <link rel="stylesheet" href="../../wireframes.css" />
  </head>
  <body>
    <div class="sheet stack" style="height: 100%; overflow-y: auto">
      <div class="topbar">
        <strong>Pulse</strong>
        <span class="site-switch">All sites ▾</span>
        <div style="flex: 1"></div>
        <a href="dashboard.html">Account</a>
      </div>

      <div class="column stack">
        <div class="row between">
          <strong>Your sites</strong>
          <span class="btn primary">+ New site</span>
        </div>

        <!-- rows, not cards: scales past three sites -->
        <a class="box row between" href="dashboard.html">
          <span><strong>Acme Docs</strong> <span class="muted">docs.acme.dev</span></span>
          <span class="chart short" style="width: 160px; height: 34px">spark</span>
          <span>12.4k <span class="muted">· 148 online</span></span>
        </a>
        <a class="box row between" href="dashboard.html">
          <span><strong>Marketing site</strong> <span class="muted">acme.com</span></span>
          <span class="muted">no data yet</span>
          <span class="muted">Finish setup →</span>
        </a>

        <p class="note">
          <strong>v2.</strong> One row per site instead of cards — a list stays
          readable at twenty sites, a card grid does not.
        </p>
      </div>
    </div>

    <nav class="vswitch"><a href="../v1/dashboard.html">v1</a><a class="on" href="../v2/dashboard.html">v2</a><a href="../v3/dashboard.html">v3</a><a href="../v4/dashboard.html">v4</a><a href="../v5/dashboard.html">v5</a><a href="../v6/dashboard.html">v6</a><a href="../v7/dashboard.html">v7</a><a href="../v8/dashboard.html">v8</a><a href="../v9/dashboard.html">v9</a><a href="../v10/dashboard.html">v10</a></nav>
  </body>
</html>
