<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account — Pulse</title>
    <link rel="stylesheet" href="../../wireframes.css" />
  </head>
  <body>
    <div class="sheet app">
      <div class="box sidebar stack">
        <strong>Pulse</strong>
        <a class="nav-item" href="sites.html">Sites</a>
        <a class="nav-item on" href="account.html">Account</a>
        <div style="flex: 1"></div>
        <span class="nav-item muted">Log out</span>
      </div>

      <div class="stack">
        <strong>Account</strong>

        <div class="box stack" style="max-width: 520px">
          <strong>Profile</strong>
          <div class="stack" style="gap: 6px">
            <span class="label">Name</span>
            <div class="box alt" style="padding: 9px 12px"><div class="line w30" style="margin: 0"></div></div>
          </div>
          <div class="stack" style="gap: 6px">
            <span class="label">Email</span>
            <div class="box alt" style="padding: 9px 12px"><div class="line w50" style="margin: 0"></div></div>
          </div>
          <div class="row end"><span class="btn primary">Save</span></div>
        </div>

        <div class="box alt stack" style="max-width: 520px">
          <strong>Password</strong>
          <div class="stack" style="gap: 6px">
            <span class="label">Current</span>
            <div class="box" style="padding: 9px 12px"><div class="line w30" style="margin: 0"></div></div>
          </div>
          <div class="stack" style="gap: 6px">
            <span class="label">New</span>
            <div class="box" style="padding: 9px 12px"><div class="line w30" style="margin: 0"></div></div>
          </div>
          <div class="row end"><span class="btn primary">Change password</span></div>
        </div>

        <div class="row"><span class="btn">Log out</span></div>
      </div>
    </div>
  <nav class="vswitch"><a class="on" href="../v1/dashboard.html">v1</a><a href="../v2/dashboard.html">v2</a><a href="../v3/dashboard.html">v3</a><a href="../v4/dashboard.html">v4</a><a href="../v5/dashboard.html">v5</a><a href="../v6/dashboard.html">v6</a><a href="../v7/dashboard.html">v7</a><a href="../v8/dashboard.html">v8</a><a href="../v9/dashboard.html">v9</a><a href="../v10/dashboard.html">v10</a></nav>
  </body>
</html>
