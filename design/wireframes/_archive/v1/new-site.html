<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New site — Pulse</title>
    <link rel="stylesheet" href="../../wireframes.css" />
  </head>
  <body>
    <div class="sheet app">
      <div class="box sidebar stack">
        <strong>Pulse</strong>
        <a class="nav-item on" href="sites.html">Sites</a>
        <a class="nav-item" href="account.html">Account</a>
        <div style="flex: 1"></div>
        <span class="nav-item muted">Log out</span>
      </div>

      <div class="stack">
        <a class="muted" href="sites.html" style="text-decoration: none">← Back to sites</a>

        <div class="box stack" style="max-width: 520px">
          <strong>Add a site</strong>

          <div class="stack" style="gap: 6px">
            <span class="label">Name</span>
            <div class="box alt" style="padding: 9px 12px">
              <div class="line w30" style="margin: 0"></div>
            </div>
            <span class="muted" style="font-size: 12px">What you'll call it here.</span>
          </div>

          <div class="stack" style="gap: 6px">
            <span class="label">Domain</span>
            <div class="box alt" style="padding: 9px 12px">
              <div class="line w50" style="margin: 0"></div>
            </div>
            <span class="muted" style="font-size: 12px">example.com — no https://</span>
          </div>

          <div class="row end">
            <a class="btn" href="sites.html">Cancel</a>
            <a class="btn primary" href="setup.html">Create site</a>
          </div>
        </div>

        <p class="note">
          No plan picker, no timezone, no "advanced". Anything else we think we
          need goes in site settings later.
        </p>
      </div>
    </div>
  <nav class="vswitch"><a class="on" href="../v1/dashboard.html">v1</a><a href="../v2/dashboard.html">v2</a><a href="../v3/dashboard.html">v3</a><a href="../v4/dashboard.html">v4</a><a href="../v5/dashboard.html">v5</a><a href="../v6/dashboard.html">v6</a><a href="../v7/dashboard.html">v7</a><a href="../v8/dashboard.html">v8</a><a href="../v9/dashboard.html">v9</a><a href="../v10/dashboard.html">v10</a></nav>
  </body>
</html>
